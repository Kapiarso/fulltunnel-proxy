name: Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        check-latest: true

    - name: Verify Dependencies
      run: |
        go mod verify

    - name: Run Go Tests
      run: |
        go test -v ./core/...

    - name: Build FullTunnel GUI
      run: |
        go build -v -ldflags "-s -w" -o fulltunnel.exe main.go

    - name: Build FullTunnel Headless CLI
      run: |
        go build -v -ldflags "-s -w" -o fulltunnel-cli.exe ./cmd/cli/main.go
